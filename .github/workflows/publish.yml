name: Publish website

# Sends the files in this repository to Cloudflare Pages (project "olympia-builders-site").
#   master           -> the live site, www.olympiaholdings.com
#   any other branch -> an unlisted preview at <branch-name>.olympia-builders-site.pages.dev
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN: a Cloudflare key with the
# "Cloudflare Pages: Edit" permission (Settings > Secrets and variables > Actions).

on:
  push:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check that the Cloudflare key is saved
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is missing, so nothing was published."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Collect the site files
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git' --exclude='.github' --exclude='README*' ./ "$RUNNER_TEMP/site/"
          echo "Files to publish: $(find "$RUNNER_TEMP/site" -type f | wc -l)"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d99a2964baadff84dc05eae03cfb3ff9
          command: pages deploy "${{ runner.temp }}/site" --project-name=olympia-builders-site --branch="${{ github.ref_name }}" --commit-hash="${{ github.sha }}" --commit-dirty=true
